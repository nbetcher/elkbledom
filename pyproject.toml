[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["BTScan.py", "ble_sniffer.py", "easyBTScan.py", "mapper_helper.py"]

[tool.ruff.lint]
select = ["B", "BLE", "DTZ", "E", "F", "I", "PIE", "PLR", "RET", "RUF", "S", "SIM", "UP"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "S311", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "SLF001"]
