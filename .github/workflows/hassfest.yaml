name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.8.0", "2026.9.0"]
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Static and unit tests
        run: |
          python -m pip install homeassistant==${{ matrix.home-assistant }} ruff==0.13.1 -r requirements_test.txt
          ruff check custom_components/elkbledom tests scripts
          ruff format --check custom_components/elkbledom tests scripts
          pytest -q
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
