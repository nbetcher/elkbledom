name: Release

concurrency:
  group: elkbledom-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version to bump? (Major.Minor.Patch)'
        required: true
        type: choice
        options:
          - Patch
          - Minor
          - Major
      title:
        description: 'Short Release title:'
        required: true
        type: string

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check publishable repository settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq \
            'if .has_issues and (.topics | length > 0) then true else error("HACS requires enabled issues and repository topics") end'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant==2026.9.0 ruff==0.13.1 -r requirements_test.txt

      - name: Run static and unit checks
        run: |
          ruff check custom_components/elkbledom tests scripts
          ruff format --check custom_components/elkbledom tests scripts
          pytest -q

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

      - name: Validate with HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

      - name: Calculate new version
        id: bump
        run: |
          CURRENT=$(jq -r '.version' custom_components/elkbledom/manifest.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ github.event.inputs.bump }}" in
            Major) NEW="$((MAJOR + 1)).0.0" ;;
            Minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            Patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bump: $CURRENT → $NEW"

      - name: Update manifest.json version
        run: |
          jq --arg v "${{ steps.bump.outputs.version }}" '.version = $v' \
            custom_components/elkbledom/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/elkbledom/manifest.json

      - name: Build and verify integration archive
        run: |
          python scripts/build_release.py

      - name: Commit and push version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/elkbledom/manifest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push --atomic origin HEAD:${{ github.ref_name }} "${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: "${{ steps.bump.outputs.version }}"
          name: "ELK-BLEDOM Integration v${{ steps.bump.outputs.version }} - ${{ github.event.inputs.title }}"
          generate_release_notes: true
          files: dist/elkbledom-${{ steps.bump.outputs.version }}.zip
