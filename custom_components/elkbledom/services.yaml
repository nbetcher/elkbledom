set_random_color:
  name: Set Random Color
  description: Set a random RGB color to the LED strip
  fields:
    entity_id:
      name: Entity
      description: The light entity to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
    brightness:
      name: Brightness
      description: Brightness level (0-255)
      required: false
      default: 255
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider

set_rgb_color:
  name: Set RGB Color
  description: Set a specific RGB color to the LED strip
  fields:
    entity_id:
      name: Entity
      description: The light entity to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
    r:
      name: Red
      description: Red value (0-255)
      required: true
      example: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    g:
      name: Green
      description: Green value (0-255)
      required: true
      example: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    b:
      name: Blue
      description: Blue value (0-255)
      required: true
      example: 64
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    brightness:
      name: Brightness
      description: Brightness level (0-255)
      required: false
      default: 255
      example: 200
      selector:
        number:
          min: 0
          max: 255
          mode: slider

sync_time:
  name: Sync Time
  description: Synchronize the device's internal clock with Home Assistant's current time.
  fields:
    entity_id:
      name: Entity
      description: The light entity (device) to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
          integration: elkbledom

schedule_on:
  name: Schedule On
  description: Program the device's built-in daily timer to turn the strip on.
  fields:
    entity_id:
      name: Entity
      description: The light entity (device) to control
      required: true
      example: "light.led1"
      selector:
        entity:
          domain: light
          integration: elkbledom
    hour:
      name: Hour
      description: Hour of day (0-23)
      required: true
      example: 7
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: Minute of hour (0-59)
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 59
          mode: box
    enabled:
      name: Enabled
      description: Whether this schedule is active.
      required: false
      default: true
      selector:
        boolean:
    days:
      name: Days
      description: Days the schedule applies to.
      required: false
      default: ["all"]
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - all
            - week_days
            - weekend_days

schedule_off:
  name: Schedule Off
  description: Program the device's built-in daily timer to turn the strip off.
  fields:
    entity_id:
      name: Entity
      description: The light entity (device) to control
