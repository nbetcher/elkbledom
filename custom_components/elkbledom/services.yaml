      description: Minute of hour (0-59)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box
    enabled:
      name: Enabled
      description: Whether this schedule is active.
      required: false
      default: true
      selector:
        boolean:
    days:
      name: Days
      description: Days the schedule applies to.
      required: false
      default: ["all"]
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
            - all
            - week_days
            - weekend_days
